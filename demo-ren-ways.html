<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人 · 三种"演示意思"的方式对比</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--cream:#FFF6E6;--card:#FFFFFF;--ink:#3A3A4A;--soft:#FFF3DF;--orange:#FF9F45;--green:#6FCF7E;--blue:#5AA9E6;--py:#E8743B;--shadow:0 18px 40px rgba(255,159,69,.20);}
*{margin:0;box-sizing:border-box;}html,body{height:100%;}
body{font-family:'Noto Serif SC',serif;color:var(--ink);overflow:hidden;background:radial-gradient(circle at 30% 20%,#FFFDF6,#FFE4BE 75%);}
.viewport{position:fixed;inset:0;display:grid;place-items:center;}
.stage{width:1920px;height:1080px;position:relative;transform-origin:center center;background:linear-gradient(160deg,#FFF9EF,#FFF0D6);border-radius:48px;overflow:hidden;box-shadow:0 30px 80px rgba(180,120,40,.28);}
.head{position:absolute;top:56px;left:0;right:0;text-align:center;}
.head h1{font-size:64px;font-weight:900;letter-spacing:6px;}
.head p{font-family:'Nunito';font-weight:700;font-size:28px;color:#C79A5E;margin-top:10px;}
.panels{position:absolute;top:220px;left:0;right:0;display:flex;justify-content:center;gap:60px;}
.panel{width:540px;height:680px;background:var(--card);border-radius:40px;box-shadow:var(--shadow);border:7px solid #FFE2BC;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:30px;}
.panel h2{font-size:40px;font-weight:900;color:var(--orange);margin-bottom:6px;}
.panel .desc{font-family:'Nunito';font-weight:700;font-size:24px;color:#B58A55;text-align:center;padding:0 30px;min-height:70px;margin-bottom:14px;}
.stagebox{position:relative;width:420px;height:420px;display:flex;align-items:center;justify-content:center;}
/* A 故事 */
.story-layer{position:absolute;font-size:170px;opacity:0;}
@keyframes a1{0%,16%{opacity:1}17%,100%{opacity:0}}
@keyframes a2{0%,16%{opacity:0}17%,33%{opacity:1}34%,100%{opacity:0}}
@keyframes a3{0%,33%{opacity:0}34%,50%{opacity:1}51%,100%{opacity:0}}
@keyframes a4{0%,50%{opacity:0}51%,67%{opacity:1}68%,100%{opacity:0}}
@keyframes a5{0%,67%{opacity:0}68%,100%{opacity:1}}
.l1{animation:a1 9s infinite}.l2{animation:a2 9s infinite}.l3{animation:a3 9s infinite}.l4{animation:a4 9s infinite}.l5{animation:a5 9s infinite;font-family:'Noto Serif SC';font-weight:900;color:var(--ink);font-size:200px}
/* B 字当小演员 */
.puppet{font-family:'Noto Serif SC';font-weight:900;font-size:230px;color:var(--ink);animation:walk 2.2s ease-in-out infinite;}
@keyframes walk{0%,100%{transform:translateX(-30px) rotate(-5deg)}50%{transform:translateX(30px) rotate(5deg)}}
.puppet-arm{position:absolute;font-size:90px;right:80px;top:120px;animation:wave 1s ease-in-out infinite;transform-origin:bottom center;}
@keyframes wave{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(22deg)}}
/* C 字理变身 */
.morph{position:absolute;font-size:200px;opacity:0;}
.morph.human{animation:mh 4s infinite;}
.morph.char{font-family:'Noto Serif SC';font-weight:900;color:var(--ink);animation:mc 4s infinite;}
@keyframes mh{0%,40%{opacity:1;transform:scale(1)}50%,100%{opacity:0;transform:scale(.6)}}
@keyframes mc{0%,40%{opacity:0;transform:scale(.6)}50%,100%{opacity:1;transform:scale(1)}}
.spark{position:absolute;font-size:70px;animation:spin 2s linear infinite;opacity:.8;}
@keyframes spin{to{transform:rotate(360deg)}}
.foot{position:absolute;bottom:30px;left:0;right:0;text-align:center;font-family:'Nunito';font-weight:700;font-size:24px;color:#B58A55;}
</style>
</head>
<body>
<div class="viewport">
  <div class="stage" id="stage">
    <div class="head"><h1>“人”字 · 三种演示意思的方式</h1><p>同一字，三种不同做法，挑一个方向</p></div>
    <div class="panels">
      <!-- A 故事 -->
      <div class="panel">
        <h2>A · 故事演示</h2>
        <div class="desc">蛋→宝宝→站起→走路→挥手，最后变成“人”字</div>
        <div class="stagebox">
          <div class="story-layer l1">🥚</div>
          <div class="story-layer l2">👶</div>
          <div class="story-layer l3">🧍</div>
          <div class="story-layer l4">🚶</div>
          <div class="story-layer l5">人</div>
        </div>
      </div>
      <!-- B 字当小演员 -->
      <div class="panel">
        <h2>B · 字当小演员</h2>
        <div class="desc">“人”字自己长出手，走来走去还挥手</div>
        <div class="stagebox">
          <div class="puppet">人</div>
          <div class="puppet-arm">👋</div>
        </div>
      </div>
      <!-- C 字理变身 -->
      <div class="panel">
        <h2>C · 字理变身</h2>
        <div class="desc">“人”字和真人剪影互相变，字就是人形</div>
        <div class="stagebox">
          <div class="morph human">🧍</div>
          <div class="morph char">人</div>
          <div class="spark">✨</div>
        </div>
      </div>
    </div>
    <div class="foot">告诉我选 A / B / C，或你有第 4 种想法——定了我按它重做全部汉字动画</div>
  </div>
</div>
<script>
function fit(){var s=Math.min(innerWidth/1920,innerHeight/1080);document.getElementById('stage').style.transform='scale('+s+')';}
addEventListener('resize',fit);fit();
</script>
</body>
</html>
